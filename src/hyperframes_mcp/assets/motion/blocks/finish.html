<!--
  Copyright 2026 the hyperframes-mcp contributors. Hand-written for the motion library (src/hyperframes_mcp/motion); it shares no code
  with the HyperFrames catalog. The three textures it draws are derived from two ambientCG maps (CC0 1.0),
  see assets/motion/textures/TEXTURES.md and assets/motion/THIRD_PARTY.md.

  The finish: a full-frame transparent overlay of paper dust and fine scratches, a few specks in the paper
  colour for each speck in the ink colour, at low opacity over everything below it. It adds only what
  data-color-grading cannot (the grading shader already gives each photograph its vignette and grain); it does
  not darken, tint or blur the picture. Three tiles are stepped at 12 frames a second with discrete
  tl.set calls (the order is a fixed hash of the step number, never the same tile twice in a row), so the
  dust is alive without moving: nothing drifts or breathes. The dust covers about 4% of the frame, so a step
  is not a flash. The overlay fades in and out over the dissolve time at the ends of its slot: mount it once
  over a whole video or act, not on every shot, or the dust would pulse at each cut.
-->
<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"durationSeconds","type":"number","label":"Seconds on screen, the fade in and the fade out included","default":10,"min":1,"max":600,"step":0.5,"unit":"s"},
    {"id":"dustOpacity","type":"number","label":"Strength of the dust and scratches, 0 (none) to 1","default":0.35,"min":0,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Finish</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #finish-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #finish-root .dust {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0;
      }
      #finish-root .tile {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="finish-root"
      data-composition-id="finish"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="10"
    >
      <div class="dust">
        <img class="tile" alt="" src="assets/textures/finish-dust-a.png" />
        <img class="tile" alt="" src="assets/textures/finish-dust-b.png" />
        <img class="tile" alt="" src="assets/textures/finish-dust-c.png" />
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // The idiom of the other blocks: the declared defaults first, then what HyperFrames resolved for this
        // composition (declared defaults plus the mount's overrides). A mounted composition's <html> is not in
        // the page, so there the second step carries the defaults.
        function readVars() {
          var out = {};
          var raw = document.documentElement.getAttribute("data-composition-variables");
          if (raw) {
            JSON.parse(raw).forEach(function (d) {
              out[d.id] = d.default;
            });
          }
          var hf = window.__hyperframes;
          var overrides =
            hf && typeof hf.getVariables === "function" ? hf.getVariables() : window.__hfVariables;
          if (overrides && typeof overrides === "object") {
            for (var key in overrides) if (overrides[key] !== undefined) out[key] = overrides[key];
          }
          return out;
        }

        // <tile-order>
        // The tile after `index` at a step: one or two places along, decided by a fixed integer hash of the
        // step number, so the order looks irregular, never repeats a tile twice in a row, and is the same on
        // every render.
        function nextTile(index, step, tiles) {
          var hash = Math.imul(step, 2654435761) >>> 0;
          return (index + 1 + ((hash >>> 16) & 1)) % tiles;
        }
        // </tile-order>

        // No literal fallbacks: a missing variable fails the render rather than drawing a wrong frame.
        var V = readVars();
        var strength = V.dustOpacity; // Number.isFinite is false for null and for text
        if (!Number.isFinite(strength) || strength < 0 || strength > 1) {
          throw new Error("finish: dustOpacity must be a number from 0 to 1, got " + V.dustOpacity);
        }

        var rootEl = document.querySelector("#finish-root");
        var dustEl = rootEl.querySelector(".dust");
        var tileEls = rootEl.querySelectorAll(".tile");

        function token(name) {
          var value = getComputedStyle(rootEl).getPropertyValue(name).trim();
          if (!value) throw new Error("tokens.css is not loaded: " + name + " is empty");
          return value;
        }
        // the dissolve time of the tokens is the fade at each end; the slot holds both and at least a moment
        var fade = Number.parseFloat(token("--dur-dissolve-min"));
        var duration = Number.parseFloat(V.durationSeconds);
        if (!Number.isFinite(duration) || duration < 2 * fade) {
          throw new Error(
            "finish: durationSeconds " + V.durationSeconds + " is shorter than the " + 2 * fade +
              " s of its fade in and fade out",
          );
        }

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(
          dustEl,
          { opacity: 0 },
          { opacity: strength, duration: fade, ease: token("--ease-move") },
          0,
        );
        tl.fromTo(
          dustEl,
          { opacity: strength },
          { opacity: 0, duration: fade, ease: token("--ease-move"), immediateRender: false },
          duration - fade,
        );

        // Twelve steps a second, half of the canvas's 24 frames: each tile holds for two frames.
        var STEPS_PER_SECOND = 12;
        var steps = Math.ceil(duration * STEPS_PER_SECOND);
        var shown = 0;
        tl.set(tileEls[shown], { opacity: 1 }, 0);
        for (var step = 1; step < steps; step++) {
          var next = nextTile(shown, step, tileEls.length);
          tl.set(tileEls[shown], { opacity: 0 }, step / STEPS_PER_SECOND);
          tl.set(tileEls[next], { opacity: 1 }, step / STEPS_PER_SECOND);
          shown = next;
        }

        window.__timelines = window.__timelines || {};
        window.__timelines["finish"] = tl;
      })();
    </script>
  </body>
</html>
