[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperframes-mcp"
version = "0.1.1"
description = "An MCP server that lets Claude Code edit a HyperFrames project while you edit it by hand in the HyperFrames desktop app (unofficial, not affiliated with HeyGen)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Pavlo Bondarenko" }]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
    "pillow>=10",
    "resvg-py>=0.2",
    "defusedxml>=0.7",
    "numpy>=1.26",
    "openai>=1.40",
    "tenacity>=8.2",
    "fonttools>=4.50",
    "python-dotenv>=1.0",
    "aiofiles>=23.2",
    "circuitbreaker>=2",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
vectorize = ["vtracer>=0.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3", "ruff>=0.6"]

[project.scripts]
hyperframes-mcp = "hyperframes_mcp.server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperframes_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/hyperframes_mcp/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B905"]
